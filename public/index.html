<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gigi Chat</title>
<style>
:root{--bg:#f4f5f8;--panel:#fff;--text:#202332;--accent:#6d5dfc;--bubble:#e9e7ff}
body[data-theme="dark"]{--bg:#151722;--panel:#202331;--text:#f4f5fb;--bubble:#35314f}
body[data-theme="ocean"]{--bg:#eaf7fb;--panel:#fff;--text:#153448;--accent:#087eaa;--bubble:#d7f1fb}
body[data-theme="pink"]{--bg:#fff0f6;--panel:#fff;--text:#4b2035;--accent:#d9468f;--bubble:#ffe0ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}
.app{max-width:900px;margin:auto;height:100dvh;display:flex;flex-direction:column;padding:12px;gap:10px}
header,.composer,.toolbar,.message{background:var(--panel);border-radius:14px;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}
input,button,select{font:inherit;border-radius:10px;border:1px solid #c8cad4;padding:9px;background:var(--panel);color:var(--text)}
button{cursor:pointer}button.primary{background:var(--accent);color:white;border:0}
#messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.message{max-width:88%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.message.mine{align-self:flex-end;background:var(--bubble)}.meta{font-size:12px;opacity:.7;margin-bottom:4px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.actions button{font-size:12px;padding:5px 7px}.composer{display:flex;gap:8px;flex-wrap:wrap}.composer input[type=text]{flex:1;min-width:130px}
#status{font-size:13px;opacity:.75}.hint{font-size:12px;opacity:.75}
.stickers{display:flex;gap:5px;flex-wrap:wrap}.sticker{font-size:26px;padding:2px 8px}
</style>
</head>
<body>
<div class="app">
<header><h1>💬 Gigi Chat</h1><div><span id="who"></span> <select id="theme" aria-label="Тема"><option value="light">Світла тема</option><option value="dark">Темна тема</option><option value="ocean">Океан</option><option value="pink">Рожева</option></select></div></header>
<div class="toolbar"><input id="name" placeholder="Твій нікнейм" maxlength="32"><button id="join" class="primary">Увійти</button><input id="search" placeholder="Пошук повідомлень"><span id="unread">Непрочитані: 0</span></div>
<div id="status">Підключення до сервера…</div>
<div id="messages" aria-live="polite"></div>
<div class="composer">
<input id="text" type="text" placeholder="Напиши повідомлення…" maxlength="4000">
<button id="send" class="primary">Надіслати</button>
<button id="schedule">Відкласти</button>
<button id="expire">Зникне за 1 год</button>
</div>
<div class="stickers"><span class="hint">Стікери:</span><button class="sticker">😀</button><button class="sticker">❤️</button><button class="sticker">😂</button><button class="sticker">🔥</button><button class="sticker">👍</button><button class="sticker">🎉</button><input id="gif" placeholder="URL GIF (необов'язково)" style="flex:1;min-width:150px"><button id="sendGif">Надіслати GIF</button></div>
<div class="hint">Тестова збірка. Для роботи потрібен запущений server.js. Повідомлення зберігаються сервером у JSON-файлі.</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
 const socket=io(); let username=localStorage.getItem('gigi_name')||''; let expireMs=0; let joined=false; let unreadCount=0; let focused=true;
 const $=id=>document.getElementById(id);
 $('name').value=username;
 const theme=localStorage.getItem('gigi_theme')||'light'; document.body.dataset.theme=theme==='light'?'light':theme; $('theme').value=theme;
 $('theme').onchange=()=>{localStorage.setItem('gigi_theme',$('theme').value);document.body.dataset.theme=$('theme').value};
 function join(){username=$('name').value.trim();if(!username){alert('Введи нікнейм');return}localStorage.setItem('gigi_name',username);joined=true;$('who').textContent='👤 '+username;socket.emit('join',{username});}
 $('join').onclick=join;
 socket.on('connect',()=>{$('status').textContent='Сервер підключено';if(username)join()});
 socket.on('disconnect',()=>{$('status').textContent='Немає з’єднання із сервером'});
 function addMessage(m){const term=$('search').value.toLowerCase();const text=(m.text||'');if(term&&!text.toLowerCase().includes(term))return;
  const div=document.createElement('div');div.className='message'+(m.username===username?' mine':'');div.dataset.id=m.id;
  const meta=document.createElement('div');meta.className='meta';meta.textContent=(m.username||'Користувач')+' · '+new Date(m.createdAt).toLocaleString()+(m.edited?' · змінено':'');div.appendChild(meta);
  if(m.kind==='gif'){const img=document.createElement('img');img.src=m.text;img.alt='GIF';img.style.maxWidth='240px';img.style.display='block';img.loading='lazy';div.appendChild(img)}else{const body=document.createElement('div');body.textContent=text;div.appendChild(body)}
  if(m.expiresAt){const e=document.createElement('div');e.className='hint';e.textContent='Тимчасове повідомлення';div.appendChild(e)}
  if(m.username===username){const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.textContent='Редагувати';edit.onclick=()=>{const v=prompt('Новий текст',m.text);if(v&&v.trim())socket.emit('edit',{id:m.id,text:v.trim()})};actions.appendChild(edit);div.appendChild(actions)}
  $('messages').appendChild(div);if(!focused&&m.username!==username){unreadCount++;$('unread').textContent='Непрочитані: '+unreadCount}if(focused)$('messages').scrollTop=$('messages').scrollHeight;
 }
 socket.on('history',list=>{ $('messages').innerHTML='';list.forEach(addMessage)});
 socket.on('message',addMessage);
 socket.on('edited',m=>{const old=document.querySelector('[data-id="'+m.id+'"]');if(old)old.remove();addMessage(m)});
 socket.on('error_msg',msg=>alert(msg));
 function send(text,kind='text',scheduledAt=null){if(!joined){alert('Спочатку натисни «Увійти»');return}if(!text.trim())return;socket.emit('send',{text:text.trim(),kind,expiresIn:expireMs,scheduledAt});$('text').value='';expireMs=0;$('expire').textContent='Зникне за 1 год';}
 $('send').onclick=()=>send($('text').value);
 $('text').addEventListener('keydown',e=>{if(e.key==='Enter')send($('text').value)});
 $('expire').onclick=()=>{expireMs=expireMs?0:3600000;$('expire').textContent=expireMs?'Тимчасово: 1 год':'Зникне за 1 год'};
 $('schedule').onclick=()=>{const val=prompt('Через скільки хвилин надіслати? (1–10080)','10');const mins=Number(val);if(!Number.isInteger(mins)||mins<1||mins>10080){alert('Введи число від 1 до 10080');return}send($('text').value,'text',Date.now()+mins*60000)};
 document.querySelectorAll('.sticker').forEach(b=>b.onclick=()=>send(b.textContent,'sticker'));
 $('sendGif').onclick=()=>{const url=$('gif').value.trim();try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw 0;send(url,'gif')}catch(e){alert('Введи коректне посилання на GIF')}};
 $('search').oninput=()=>{socket.emit('get_history')};
 window.addEventListener('focus',()=>{focused=true;unreadCount=0;$('unread').textContent='Непрочитані: 0'});
 window.addEventListener('blur',()=>focused=false);
})();
</script>
</body>
</html>
