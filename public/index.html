<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>gigi chat</title>
<style>
:root{
  --bg:#0e1621; --panel:#17212b; --panel2:#1e2c3a; --line:#243447;
  --out:#2b5278; --in:#182533; --accent:#5ea8e0; --text:#e6edf3; --muted:#7d8b99;
  --online:#4fd18b; --danger:#e5736b;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:15px;overscroll-behavior:none;touch-action:pan-x pan-y}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.login{height:100%;display:grid;place-items:center;padding:24px}
.card{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px}
.card h1{margin:0 0 6px;font-size:22px;font-weight:650;letter-spacing:-.01em}
.card p{margin:0 0 20px;color:var(--muted);line-height:1.5}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.field:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#0b1520;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
.error .hint{color:var(--danger)}
.lang{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.lang button{background:none;border:0;padding:4px 7px;border-radius:6px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--panel2);color:var(--text)}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px;font-size:13px}
.icon:hover{color:var(--text);background:var(--panel2)}
.app{height:100%;display:grid;grid-template-columns:320px 1fr}
.sidebar{background:var(--panel);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.side-top{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:-.01em;flex:1}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.item:hover{background:var(--panel2)}
.item.active{background:var(--out)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;position:relative;color:#fff}
.dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--panel)}
.meta{min-width:0;flex:1}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{background:var(--accent);color:#0b1520;border-radius:999px;font-size:12px;font-weight:700;padding:1px 7px;min-width:20px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:28px 16px;line-height:1.5}
.status{font-size:13px;color:var(--muted)}
.status.on{color:var(--online)}
.chat{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.chat-view{display:flex;flex-direction:column;flex:1;min-height:0}
.chat-top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:none}
.messages{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px clamp(12px,4vw,48px);display:flex;flex-direction:column;gap:6px}
.msg{max-width:min(520px,80%);padding:8px 12px;border-radius:14px;background:var(--in);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;border-bottom-left-radius:4px}
.msg.own{align-self:flex-end;background:var(--out);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.time{display:block;font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.msg.own .time{color:#a9c4de}
.composer{display:flex;gap:10px;align-items:flex-end;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;max-height:140px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;line-height:1.4}
.composer textarea:focus{border-color:var(--accent)}
.placeholder{margin:auto;color:var(--muted);text-align:center;padding:24px}
.stories{display:flex;gap:12px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.stories[hidden]{display:none!important}
.story{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--text);font-size:12px;flex:none}
.story .ring{width:56px;height:56px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#5ea8e0,#4fd18b)}
.story.seen .ring{background:var(--line)}
.story .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);font-weight:700;font-size:18px}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:25;display:flex;align-items:center;justify-content:center;padding:24px}
.viewer[hidden]{display:none!important}
.viewer-box{background:var(--panel);border-radius:16px;padding:32px 28px 28px;max-width:420px;width:100%;position:relative;white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.5}
.viewer-title{font-size:13px;color:var(--muted);margin-bottom:12px}
.viewer-close{position:absolute;top:8px;right:10px}
.viewer-img{width:100%;max-height:55vh;object-fit:contain;border-radius:12px;margin-bottom:12px;display:block}
.viewer-img[hidden]{display:none!important}
.viewer-box{max-height:90vh;overflow-y:auto}
#storyDelBtn{margin-top:16px;width:100%;text-align:center}
.gone{color:var(--muted);font-style:italic}
:root[data-theme="light"]{--bg:#eef2f7;--panel:#ffffff;--panel2:#e6ebf2;--line:#d5dce6;--out:#d6e7fb;--in:#ffffff;--accent:#2b7bc4;--text:#1b2631;--muted:#66768a;--online:#2fa86a;--danger:#d9534f}
:root[data-theme="purple"]{--bg:#171225;--panel:#211a33;--panel2:#302545;--line:#44345e;--out:#49316d;--in:#261d38;--accent:#b78cff;--text:#f6efff;--muted:#b9a9ce;--online:#52d69a;--danger:#ff7777}
:root[data-theme="ocean"]{--bg:#071b2b;--panel:#0d293d;--panel2:#15384e;--line:#24516a;--out:#174766;--in:#0e3047;--accent:#42c6e8;--text:#e8f8ff;--muted:#9cc2d2;--online:#52d69a;--danger:#ff7777}
:root[data-theme="rose"]{--bg:#28151e;--panel:#38202c;--panel2:#4a2a39;--line:#664052;--out:#71374f;--in:#402532;--accent:#ff8eb7;--text:#fff0f5;--muted:#d6a8b9;--online:#52d69a;--danger:#ff7777}
.modal-box{max-height:85vh;overflow-y:auto;max-width:460px;font-size:15px;line-height:1.4}
.pf-head{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:18px}
.pf-avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.pf-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf-name{font-size:20px;font-weight:650}
.pf-status{font-size:13px;color:var(--muted)}
.pf-status.on{color:var(--online)}
.pf-bio{background:var(--bg);border-radius:12px;padding:12px 14px;margin:12px 0;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.pf-bio.empty{color:var(--muted);font-style:italic}
.pf-actions{display:flex;flex-direction:column;gap:8px}
.pf-actions .btn{width:100%}
.pf-actions .btn.ghost{background:var(--panel2);color:var(--text)}
.pf-actions .btn.danger{background:var(--danger);color:#fff}
.acc-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.acc-row .meta{min-width:0;flex:1}
.acc-row .sub{font-size:12px;color:var(--muted)}
.acc-row .sub.on{color:var(--online)}
.acc-row .btn{padding:7px 10px;font-size:13px}
.acc-head{font-size:18px;font-weight:650;margin-bottom:6px}
.acc-foot{margin-top:18px}
.clickable{cursor:pointer}
.gift-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.gcard{background:var(--bg);border-radius:12px;padding:6px;cursor:pointer;text-align:center;min-width:0}
.gcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.gcard-name{font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard-price{font-size:12px;color:#f5c542}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shelf img{width:100%;aspect-ratio:1;height:auto}
body{background-size:cover;background-position:center;background-attachment:fixed}
body.has-bg .chat,body.has-bg .messages{background:transparent}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.react{background:var(--panel2);border:0;border-radius:999px;padding:2px 9px;font-size:13px;color:var(--text);cursor:pointer}
.react.mine{background:var(--accent);color:#0b1520}
.emoji-bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.emoji-bar button{font-size:24px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:10px}
.emoji-bar button:hover{background:var(--panel2)}
#storyReacts{margin-bottom:8px}
.chan-note{padding:14px 16px;text-align:center;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:10px}
.chan-note .btn{min-width:160px}
.gift-card{display:flex;flex-direction:column;gap:6px;width:240px;max-width:100%}
.gift-card img{width:100%;max-height:240px;object-fit:cover;border-radius:12px;display:block}
.gift-title{font-weight:650}
.gift-desc{font-size:13px;color:var(--muted);white-space:pre-wrap}
.gift-price{color:#f5c542;font-weight:600}
.shelf{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.shelf img{width:60px;height:60px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.stories{display:flex;gap:12px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.story{flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--muted);font-size:11px;padding:0}
.story-ring{width:52px;height:52px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#5ea8e0,#4fd18b);display:grid;place-items:center}
.story-ring span{width:100%;height:100%;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--text);font-weight:700;font-size:18px}
.story.add .story-ring{background:var(--panel2)}
.story-view{position:fixed;inset:0;background:rgba(5,10,16,.92);z-index:25;display:flex;align-items:center;justify-content:center;padding:24px;cursor:pointer}
.story-view[hidden]{display:none!important}
.story-card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:17px;cursor:default}
.story-meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.chat-top{position:relative}
.menu{position:absolute;right:12px;top:58px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:15;min-width:200px;padding:6px}
.menu-item{display:block;width:100%;background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--danger)}
.menu-item:hover{background:var(--panel)}
.msg img.media,.msg video.media{display:block;max-width:100%;max-height:320px;border-radius:10px;cursor:pointer}
.msg audio.media{display:block;width:240px;max-width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:9;max-width:90vw}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{border-right:0}
  .app.chat-open .sidebar{display:none}
  .app:not(.chat-open) .chat{display:none}
  .back{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.poll-card{min-width:220px;max-width:340px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);display:grid;gap:8px}.poll-option{display:flex;justify-content:space-between;gap:12px;text-align:left;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer}.poll-option.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}.acc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}

.visual-edit-mode *{cursor:crosshair!important}
.visual-edit-mode .visual-edit-selected{outline:3px solid #ffb020!important;outline-offset:2px!important}
.visual-edit-mode #modal,.visual-edit-mode #toast{cursor:auto!important}
#modalBody input[type=text],
/* Telegram-inspired floating bottom navigation */
.mobile-bottom-nav{display:none}
@media (max-width:760px){
 .mobile-bottom-nav{position:fixed;z-index:40;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(88vw,540px);min-height:82px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:6px 8px;background:rgba(29,48,63,.96);border:1px solid rgba(116,145,165,.18);border-radius:58px;box-shadow:0 12px 36px rgba(0,0,0,.32);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
 .mobile-nav-item{height:70px;min-width:0;border:0;border-radius:48px;background:transparent;color:#f3f7fb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:clamp(12px,3.2vw,16px);font-weight:650;cursor:pointer;padding:5px 2px}
 .mobile-nav-item .mobile-nav-icon{font-size:clamp(27px,6.5vw,36px);line-height:1}
 .mobile-nav-item.active{background:#20394c;color:#55baf4;box-shadow:inset 0 0 0 1px rgba(110,174,211,.08)}
 .mobile-nav-item:active{transform:scale(.97)}
 .mobile-nav-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#344b5d;background-size:cover;background-position:center;font-size:25px;overflow:hidden}
 .sidebar{padding-bottom:100px}.chat{padding-bottom:100px}
}
@media (max-width:380px){.mobile-bottom-nav{min-height:74px;padding:4px 6px;width:90vw;bottom:calc(16px + env(safe-area-inset-bottom))}.mobile-nav-item{height:64px;font-size:11px}.mobile-nav-item .mobile-nav-icon{font-size:27px}.mobile-nav-avatar{width:34px;height:34px}}
</style>
</head>
<body>

<section id="login" class="login" hidden>
  <form class="card" id="loginForm" novalidate>
    <h1>gigi chat</h1>
    <p data-i18n="tagline"></p>
    <label for="nick" data-i18n="nickLabel"></label>
    <input id="nick" class="field" autocomplete="username" maxlength="20">
    <label for="pass" data-i18n="passLabel" style="margin-top:14px"></label>
    <input id="pass" class="field" type="password" autocomplete="current-password" maxlength="100">
    <div class="hint" id="loginHint"></div>
    <button class="btn" style="width:100%;margin-top:14px" data-i18n="enter"></button>
    <div class="lang" style="justify-content:center;margin-top:18px">
      <button type="button" data-set-lang="en">EN</button>
      <button type="button" data-set-lang="uk">УК</button>
      <button type="button" data-set-lang="ru">РУ</button>
    </div>
  </form>
</section>

<section id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="side-top">
      <div class="row">
        <button class="icon" id="myProfileBtn" aria-label="profile" title="Профіль">👤</button>
        <div class="brand">gigi chat</div>
        <button class="icon" id="searchMsgBtn" data-i18n-title="searchMsgTitle">🔎</button>
        <button class="icon" id="inviteBtn" data-i18n-title="inviteTitle" aria-label="invite">🔗</button>
        <div class="lang">
          <button type="button" data-set-lang="en">EN</button>
          <button type="button" data-set-lang="uk">УК</button>
          <button type="button" data-set-lang="ru">РУ</button>
        </div>
      </div>
      <input id="search" class="field" type="search" autocomplete="off" data-i18n-ph="search">
      <div class="row"><select id="folderFilter" class="field" aria-label="Папка чатів"><option value="all">Усі чати</option><option value="personal">Особисті</option><option value="groups">Групи</option><option value="channels">Канали</option></select><button class="icon" id="folderManage" title="Папки">📁</button></div>
    </div>
    <input id="storyPhoto" type="file" accept="image/*" hidden>
    <input id="myStoryPhoto" type="file" accept="image/*" hidden>
    <input id="bgInput" type="file" accept="image/*" hidden>
    <div class="stories" id="stories" hidden></div>
    <div class="list" id="list"></div>
    <div class="side-top" style="border-top:1px solid var(--line);border-bottom:0">
      <div class="row">
        <span class="status" id="meName" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button class="icon" id="photoBtn" data-i18n="photoBtn" hidden></button>
        <input id="avatarInput" type="file" accept="image/*" hidden>
        <input id="groupAvatarInput" type="file" accept="image/*" hidden>
        <button class="icon" id="groupsBtn" data-i18n-title="groupsBtn">👥</button>
        <button class="icon" id="adminBtn" data-i18n-title="adminBtn">🔑</button>
        <button class="icon" id="storyBtn" data-i18n-title="storyBtn" hidden>📖</button>
        <button class="icon" id="storyPhotoBtn" data-i18n-title="storyPhotoBtn" hidden>🖼</button>
        <button class="icon" id="renameBtn" data-i18n="renameBtn" hidden></button>
        <button class="icon" id="deleteBtn" data-i18n="deleteBtn" style="color:var(--danger)" hidden></button>
        <button class="icon" id="settingsBtn" aria-label="settings" title="Налаштування">⚙</button>
        <button class="icon" id="logout" aria-label="logout">⎋</button>
      </div>
      <div class="hint" id="net"></div>
    </div>
  </aside>
  <main class="chat" id="chat">
    <div class="placeholder" id="placeholder" data-i18n="selectChat"></div>
    <div class="chat-view" id="chatView" hidden>
      <header class="chat-top">
        <button class="icon back" id="back" aria-label="back">←</button>
        <div class="avatar" id="hAvatar" style="width:40px;height:40px;font-size:15px"></div>
        <div class="meta">
          <div class="name" id="hName"></div>
          <div class="status" id="hStatus"></div>
        </div>
        <button class="icon" id="giftChatBtn" title="Подарунок">🎁</button>
        <button class="icon" id="moreBtn" aria-label="menu">⋮</button>
      </header>
      <div id="chatMenu" class="menu" hidden>
        <button id="complaintBtn" class="menu-item" data-i18n="complaintBtn"></button>
        <button id="blockChatBtn" class="menu-item" data-i18n="blockBtn"></button>
        <button id="removeContactSelfBtn" class="menu-item">🗑️ Видалити контакт для себе</button>
        <button id="removeContactBothBtn" class="menu-item">⚠️ Видалити контакт і всю історію для обох</button>
        <button id="adminDelBtn" class="menu-item" data-i18n="adminDelete"></button>
      </div>
      <div id="pinBar" class="pin-bar" hidden></div>
      <div class="messages" id="messages"></div>
      <div id="replyBar" class="chan-note" hidden></div>
      <form class="composer" id="composer">
        <button type="button" class="icon" id="attachBtn" data-i18n="attachBtn"></button>
        <button type="button" class="icon" id="pollBtn" title="Створити опитування" hidden>📊</button>
        <input id="fileInput" type="file" accept="image/*,video/mp4,video/webm,video/quicktime,.pdf,.zip,.doc,.docx,.xls,.xlsx,.csv,.txt" hidden>
        <textarea id="input" rows="1" data-i18n-ph="typeMessage"></textarea>
        <button class="btn" data-i18n="send"></button>
      </form>
      <div id="chanNote" class="chan-note" hidden></div>
    </div>
  </main>

// Rename a contact everywhere on this page (chat list, cached messages, open chat).
function renameLocal(from, to) {
  if (chats.has(from)) { const c = chats.get(from); chats.delete(from); chats.set(to, c); }
  if (cache.has(from)) { const list = cache.get(from); cache.delete(from); cache.set(to, list); }
  for (const list of cache.values()) for (const m of list) {
    if (m.from === from) m.from = to;
    if (m.to === from) m.to = to;
  }
  for (const c of chats.values()) if (c.last) {
    if (c.last.from === from) c.last.from = to;
    if (c.last.to === from) c.last.to = to;
  }
  if (active === from) active = to;
}

function createSocket() {
  socket = io();
  socket.on('connect', () => {
    setNet(true);
    let payload = null;
    if (pending) { payload = pending; pending = null; }
    else if (localStorage.getItem('gigi_token')) payload = { token: localStorage.getItem('gigi_token') };
    if (payload) socket.emit('login', payload, onLogin);
  });
  socket.on('disconnect', () => setNet(false));
  socket.on('presence', list => { online = new Set(list); renderList(); renderHeader(); if (active) refreshInfo(active); });
  socket.on('conversation_removed_both', ({ a, b }) => {
    const other = a === me ? b : (b === me ? a : null);
    if (!other) return;
    chats.delete(other); cache.delete(other);
    if (active === other) closeChat();
    renderList();
    toast('Контакт і переписку видалено для обох');
  });
  socket.on('message', onMessage);
  socket.on('msg_deleted', onMsgDeleted);
  socket.on('msg_edited', m => { for (const list of cache.values()) { const x=list.find(v=>v.id===m.id); if(x){x.text=m.text;x.edited_at=m.edited_at;} } if(active) renderMessages(); });
  socket.on('stories', list => { stories = list || []; renderStories(); });
  socket.on('story', s => {
    stories = [s, ...stories.filter(x => x.id !== s.id)];
    renderStories();
    if (!s.author) toast(t('newStory'));
  });
  socket.on('story_deleted', ({ id }) => {
    stories = stories.filter(s => s.id !== id);
    renderStories();
    if (Number($('storyDelBtn').dataset.id) === id) $('viewer').hidden = true;
  });
  socket.on('avatars', obj => { avatars = new Map(Object.entries(obj || {})); renderList(); renderHeader(); });
  socket.on('profile_status', ({ nick, statusText }) => { const i=userInfo.get(nick); if(i) i.statusText=statusText||''; });
  socket.on('avatar', ({ nick, url }) => {
    if (url) avatars.set(nick, url); else avatars.delete(nick);
    renderList(); renderHeader();
    if (nick === me && $('modal').hidden === false) openProfile(me);
  });
  socket.on('reaction', ({ type, id, reactions }) => {
    if (type === 'gmsg') {
      for (const list of gcache.values()) for (const m of list) if (m.id === id) m.reactions = reactions;
      if (activeGroup) renderMessages();
      return;
    }
    if (type === 'msg') {
      for (const list of cache.values()) for (const m of list) if (m.id === id) m.reactions = reactions;
      if (active) renderMessages();
      return;
    }
    const s = stories.find(x => x.id === id);
    if (s) s.reactions = reactions;
    renderStories();
    if (s && Number($('storyDelBtn').dataset.id) === id && !$('viewer').hidden) renderStoryReacts(s);
  });
  socket.on('gmessage', ({ chat, msg }) => {
    const list = gcache.get(chat);
    if (list && !list.some(x => x.id === msg.id)) list.push(msg);
    const g = groups.get(chat);
    if (g) {
      g.last = msg;
      if (msg.from !== me && activeGroup !== chat) {
        g.unread = (g.unread || 0) + 1;
        toast(t('newGroupMsg', { title: g.title }));
      }
      if (activeGroup === chat) g.unread = 0;
    }
    if (activeGroup === chat) renderMessages();
    renderList();
  });
  socket.on('gpinned', ({ chat, id }) => { const list=gcache.get(chat)||[]; list.forEach(m=>m.pinned=(m.id===id)); if(activeGroup===chat) renderPinBar(); });
  socket.on('poll_updated', ({ chat, id, pollResults, myVote }) => {
    const list = gcache.get(chat) || [];
    const m = list.find(x => x.id === id);
    if (m) { m.pollResults = pollResults || {}; if (myVote !== undefined) m.myVote = myVote; }
    if (activeGroup === chat) renderMessages();
  });
  socket.on('group_removed', ({ id }) => {
    const g = groups.get(id); if (g) g.joined = false;
    gcache.delete(id);
    if (activeGroup === id) { closeChat(); toast('Тебе видалили з групи'); }
    refreshGroups();
  });
  socket.on('gmsg_deleted', ({ chat, id }) => {
    const list = gcache.get(chat);
    if (list) gcache.set(chat, list.filter(m => m.id !== id));
    if (activeGroup === chat) renderMessages();
    refreshGroups();
  });
  socket.on('group_avatar', ({ id, url }) => {
    const g = groups.get(id); if (g) g.avatar = url || null;
    renderList(); if (activeGroup === id) renderGroupHeader();
  });
  socket.on('histories_cleared', () => {
    cache.clear(); gcache.clear();
    for (const g of groups.values()) { g.last = null; g.unread = 0; }
    if (active) renderMessages();
    if (activeGroup) renderMessages();
    renderList();
  });
  socket.on('group_deleted', ({ id }) => {
    groups.delete(id);
    gcache.delete(id);
    if (activeGroup === id) closeChat();
    renderList();
  });
  socket.on('app_config', c => {
    writesStopped = Boolean(c?.stopped);
    visualRules = c?.visualRules && typeof c.visualRules === 'object' ? c.visualRules : {};
    applyVisualRules();
    ensureVisualObserver();
    if (c?.bg) {
      document.body.style.backgroundImage = `url("${c.bg}")`;
      document.body.classList.add('has-bg');
    } else {
      document.body.style.backgroundImage = '';
      document.body.classList.remove('has-bg');
    }
    renderComposer();
  });
  socket.on('all_deleted', () => {
    sessionStorage.setItem('gigi_flash', 'allDeleted');
    forget();
    location.reload();
  });
  socket.on('read', ({ by, at }) => {
    let changed = false;
    for (const m of cache.get(by) || []) {
      if (m.from === me && !m.read_at) { m.read_at = at; changed = true; }
    }
    if (changed && active === by) renderMessages();
  });
  socket.on('renamed', ({ from, to }) => {
    if (from === me) {
      me = to;
      localStorage.setItem('gigi_nick', me);
      $('meName').textContent = me;
    }
    renameLocal(from, to);
    renderList(); renderHeader(); if (active) renderMessages();
  });
  socket.on('user_deleted', ({ nick }) => {
    chats.delete(nick); cache.delete(nick);
    if (active === nick) closeChat();
    renderList();
  });
  socket.on('account_deleted', () => {
    sessionStorage.setItem('gigi_flash', 'accountDeleted');
    forget();
    location.reload();
  });
}

function onLogin(res) {
  if (!res?.ok) {
    if (res?.error === 'bad_session') { forget(); showLogin(); setHint('errSession', true); return; }
    showLogin();
    const keys = { invalid_nick: 'errInvalidNick', invalid_password: 'errShortPass', nick_taken: 'errTaken',
      handle_required: 'handleRequired', invalid_handle: 'handleInvalid', handle_taken: 'handleTaken' };
    setHint(keys[res?.error] || 'errNetwork', true);
    return;
  }
  me = res.nick;
  localStorage.setItem('gigi_nick', me);
  if (res.token) localStorage.setItem('gigi_token', res.token);
  loadMe();
  showApp();
}

function mediaNode(m) {
  if (m.kind === 'gone') return el('span', { class: 'gone' }, t('photoGone'));
  if (m.kind === 'gift') {
    let g = null;
    try { g = JSON.parse(m.text); } catch {}
    if (!g) return el('span', {}, '🎁 ' + t('giftLabel'));
    return el('div', { class: 'gift-card' },
      el('img', { src: g.image, alt: '' }),
      el('div', { class: 'gift-title' }, g.title),
      g.description ? el('div', { class: 'gift-desc' }, g.description) : el('span', { hidden: '' }),
      el('div', { class: 'gift-price' }, '⭐ ' + g.price + (g.count > 1 ? '  × ' + g.count : '')));
  }
  if (!m.kind || m.kind === 'text') return null;
  const stop = e => e.stopPropagation();
  if (m.kind === 'image') return el('img', { src: m.text, alt: '', class: 'media', onclick: e => { stop(e); window.open(m.text, '_blank'); } });
  if (m.kind === 'video') return el('video', { src: m.text, controls: '', playsinline: '', class: 'media', onclick: stop });
  if (m.kind === 'audio') return el('audio', { src: m.text, controls: '', preload: 'metadata', onclick: stop, style: 'max-width:100%;display:block;margin:6px 0' });
  if (m.kind === 'file') return el('a', { href: m.text, target: '_blank', rel: 'noopener', onclick: stop, class: 'file-attachment' }, '📎 Відкрити / завантажити файл');
  return null;
}

function previewText(m) {
  if (m.kind === 'gift') {
    try { return '🎁 ' + JSON.parse(m.text).title; } catch { return '🎁 ' + t('giftLabel'); }
  }
  if (m.kind === 'image') return '📷 ' + t('photoLabel');
  if (m.kind === 'video') return '🎬 ' + t('videoLabel');
  if (m.kind === 'audio') return '🎙️ ' + t('voiceLabel');
  if (m.kind === 'file') return '📎 Файл';
  return m.text;
}

function readAsDataURL(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function sendMedia(blob) {
  if (!socket?.connected) return toast(t('errNetwork'));
  if (blob.size > 15 * 1024 * 1024) return toast(t('fileTooBig'));
  const mime = (blob.type || 'application/octet-stream').split(';')[0].toLowerCase();
  const kind = mime.startsWith('image/') ? 'image' : mime.startsWith('video/') ? 'video' : 'file';
  let data;
  try { data = await readAsDataURL(blob); }
  catch { return toast(t('uploadFailed')); }
  let res;
  try {
    res = await (await fetch('/api/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: localStorage.getItem('gigi_token'), data })
    })).json();
  } catch { return toast(t('uploadFailed')); }
  if (!res?.ok) {
    const keys = { too_big: 'fileTooBig', bad_type: 'badFile' };
    return toast(t(keys[res?.error] || 'uploadFailed'));
  }
  const done = res2 => { if (!res2?.ok) toast(t('messageFailed')); };
  if (activeGroup) socket.emit('group_send', { id: activeGroup, text: res.url, kind: res.kind || kind }, done);
  else if (active) socket.emit('message', { to: active, text: res.url, kind: res.kind || kind }, done);
  else toast(t('selectChat'));
}

function deleteMessage(m) {
  if (m.from !== me && !(myPremium && !activeGroup)) return;
  if (!confirm(t('confirmDeleteMsg'))) return;
  if (!socket?.connected) return toast(t('errNetwork'));
  socket.emit(activeGroup ? 'gmsg_delete' : 'msg_delete', { id: m.id }, res => { if (!res?.ok) toast(t('messageFailed')); });
}

function onMsgDeleted({ id, from, to }) {
  const partner = from === me ? to : from;
  const list = cache.get(partner);
  if (list) cache.set(partner, list.filter(m => m.id !== id));
  const c = chats.get(partner);
  if (c?.last?.id === id) c.last = null;
  if (active === partner) renderMessages();
  renderList();
  loadChats();
  if (from !== me) toast(t('msgDeleted'));
}

function onMessage(m) {
  const partner = m.from === me ? m.to : m.from;
  const list = cache.get(partner);
  if (list && !list.some(x => x.id === m.id)) list.push(m);

  const c = chats.get(partner) || { last: null, unread: 0 };
  c.last = m;
  if (m.from !== me && partner !== active) {
    c.unread = (c.unread || 0) + 1;
    if (!mutedChats.has(partner)) toast(t('newMessage', { name: partner }));
    if (!mutedChats.has(partner) && document.hidden && 'Notification' in window && Notification.permission === 'granted')

  }
  chats.set(partner, c);

  if (partner === active) {
    c.unread = 0;
    renderMessages();
    if (m.from !== me) markRead(partner);
  }
  renderList();

}

// Shrinks a photo to at most 1280 px and JPEG quality 75%, so it stays small.
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => (b ? resolve(b) : reject(new Error('blob'))), 'image/jpeg', 0.75);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function uploadBlob(blob) {
  const data = await readAsDataURL(blob);
  const res = await (await fetch('/api/upload', {

    body: JSON.stringify({ token: localStorage.getItem('gigi_token'), data })
  })).json();
  if (!res?.ok) throw new Error(res?.error || 'upload');
  return res.url;
}

// Shows the counts under a message or story; a tap on a chip toggles your own reaction.
function reactRow(reactions, type, id) {

    const users = reactions[emoji];

  return el('div', { class: 'emoji-bar' }, ...EMOJIS.map(emoji =>
    el('button', { onclick: () => { if (onPicked) onPicked(); toggleReact(type, id, emoji); } }, emoji)));

function openMsgMenu(m, type = 'msg') {
  const items = [emojiBar(type, m.id, closeModal)];
  items.push(el('button', { class: 'btn ghost', style: 'width:100%', onclick: () => { closeModal(); replyTarget=m; editTarget=null; $('replyBar').hidden=false; $('replyBar').textContent='Відповідь на '+m.from+': '+String(m.text||'').slice(0,100)+'  ✕'; $('replyBar').onclick=()=>{replyTarget=null;$('replyBar').hidden=true;}; $('input').focus(); } }, '↩ Відповісти з цитатою'));
  if (type === 'gmsg' && activeGroup && groups.get(activeGroup)?.owner === me) items.push(el('button', { class: 'btn ghost', style: 'width:100%', onclick: () => { closeModal(); socket.emit('gmsg_pin', { id: m.id, on: !m.pinned }, r => { if (!r?.ok) return toast('Не вдалося закріпити'); const list=gcache.get(activeGroup)||[]; list.forEach(x=>x.pinned=x.id===m.id ? !m.pinned : false); renderMessages(); renderPinBar(); }); } }, m.pinned ? '📌 Відкріпити' : '📌 Закріпити'));
  if (type === 'msg' && m.from === me && m.kind === 'text') items.push(el('button', { class: 'btn ghost', style: 'width:100%', onclick: () => { closeModal(); editTarget=m; replyTarget=null; $('input').value=m.text; $('replyBar').hidden=false; $('replyBar').textContent='Редагування повідомлення · Enter — зберегти'; $('input').focus(); } }, '✎ Редагувати'));
  if (type === 'msg') items.push(el('button', { class: 'btn ghost', style: 'width:100%', onclick: () => { closeModal(); const to=prompt('Переслати користувачу (нікнейм):'); if(!to?.trim()) return; socket.emit('message',{to:to.trim(),text:'Переслано від '+m.from+':\n'+m.text,kind:'text'},r=>toast(r?.ok?'Переслано':'Не вдалося переслати')); } }, '➦ Переслати'));
  if (m.from === me || (myPremium && type === 'msg')) items.push(el('button', { class: 'btn danger', style: 'width:100%', onclick: () => { closeModal(); deleteMessage(m); } }, t('deleteMsgBtn')));
  if (type === 'msg') items.push(el('button', { class: 'btn ghost', style: 'width:100%', onclick: () => { closeModal(); const f=prompt('Папка: personal / groups / channels',chatFolders[active]||'personal'); if(['personal','groups','channels'].includes(f)){chatFolders[active]=f;localStorage.setItem('gigi_folders',JSON.stringify(chatFolders));renderList();} const mute=confirm('Вимкнути сповіщення для цього чату?'); if(mute)mutedChats.add(active);else mutedChats.delete(active);localStorage.setItem('gigi_muted',JSON.stringify([...mutedChats])); } }, '📁 Папка / 🔕 Сповіщення'));
  openModal(items);
}

function renderStoryReacts(s) {
  $('storyReacts').replaceChildren(reactRow(s.reactions, 'story', s.id), emojiBar('story', s.id));
}

function refreshGroups(done) {
  if (!socket?.connected) return;
  socket.emit('group_list', {}, res => {
    if (!res?.ok) return;
    const unread = new Map([...groups].map(([id, g]) => [id, g.unread || 0]));
    groups = new Map(res.chats.map(c => [c.id, { ...c, unread: unread.get(c.id) || 0 }]));
    renderList();
    renderHeader();
    renderComposer();
    if (done) done();
  });
}

function groupAvatarNode(g, size = 44) {
  const av = el('div', { class: 'avatar', style: `width:${size}px;height:${size}px` }, g.kind === 'channel' ? '📢' : '👥');
  av.style.background = avatarBg(g.title);
  if (g.avatar) av.replaceChildren(el('img', { src: g.avatar, alt: '' }));
  return av;
}

function groupItem(g) {
  const av = groupAvatarNode(g);
  const preview = g.last ? (g.last.from === me ? t('you') + ': ' : '') + previewText(g.last) : '';
  const btn = el('button', { class: 'item' + (g.id === activeGroup ? ' active' : ''), onclick: () => openGroup(g.id) },
    av,
    el('div', { class: 'meta' }, el('div', { class: 'name' }, g.title), el('div', { class: 'preview' }, preview)));
  if (g.unread) btn.append(el('span', { class: 'badge' }, String(g.unread)));
  return btn;
}

function renderGroupHeader() {
  $('removeContactSelfBtn').hidden = true; $('removeContactBothBtn').hidden = true;
  const g = groups.get(activeGroup);
  if (!g) return;
  $('hName').textContent = g.title;
  const av = $('hAvatar');
  av.textContent = g.kind === 'channel' ? '📢' : '👥';
  av.style.background = avatarBg(g.title);
  if (g.avatar) av.replaceChildren(el('img', { src: g.avatar, alt: '' }));
  const st = $('hStatus');
  st.textContent = g.kind === 'channel' ? t('channelInfo', { n: g.members }) : t('groupInfo', { n: g.members });
  st.classList.remove('on');
}

function renderComposer() {
  if (writesStopped) {
    $('composer').hidden = true;
    $('chanNote').hidden = false;
    $('chanNote').replaceChildren(el('div', {}, t('writesStopped')));
    return;
  }
  const g = activeGroup ? groups.get(activeGroup) : null;
  const note = $('chanNote');
  const notMember = Boolean(g) && !g.joined;
  const readOnly = Boolean(g) && g.kind === 'channel' && g.owner !== me;
  $('composer').hidden = notMember || readOnly;
  $('pollBtn').hidden = !g || notMember || readOnly || g.kind === 'channel' && g.owner !== me;
  note.hidden = !(notMember || readOnly);
  if (!note.hidden) {
    note.replaceChildren(el('div', {}, notMember ? t('joinToWrite') : t('channelReadOnly')));
    if (notMember) note.append(el('button', { class: 'btn', onclick: () => joinGroup(g.id) }, t('joinBtn')));
  }
}

function renderPinBar() {
  const bar = $('pinBar');
  if (!activeGroup) { bar.hidden = true; return; }
  const pinned = (gcache.get(activeGroup) || []).find(m => m.pinned);
  bar.hidden = !pinned;
  if (pinned) bar.textContent = '📌 Закріплено: ' + (pinned.kind === 'poll' ? (() => { try { return JSON.parse(pinned.text).question; } catch { return 'Опитування'; } })() : String(pinned.text || '').slice(0, 120));
}

function openGroup(id) {
  active = null;
  activeGroup = id;
  const g = groups.get(id);
  if (g) g.unread = 0;
  if (search) { search = ''; results = []; $('search').value = ''; }
  $('placeholder').hidden = true;
  $('chatView').hidden = false;
  $('app').classList.add('chat-open');
  renderHeader(); renderList(); renderMessages(); renderComposer();
  socket.emit('group_history', { id }, res => {
    if (!res?.ok) return;
    const existing = gcache.get(id) || [];
    const ids = new Set(res.messages.map(m => m.id));
    gcache.set(id, [...res.messages, ...existing.filter(m => !ids.has(m.id))]);
    if (activeGroup === id) { renderMessages(); renderPinBar(); }
  });
  $('input').focus();
}

function joinGroup(id) {
  socket.emit('group_join', { id }, res => {
    if (!res?.ok) return toast(t('messageFailed'));
    toast(t('groupJoined'));
    refreshGroups(() => { if (activeGroup === id) openGroup(id); });
  });
}

function leaveGroup(id) {
  socket.emit('group_leave', { id }, res => {
    if (!res?.ok) return toast(t(res?.error === 'owner' ? 'ownerCantLeave' : 'messageFailed'));
    toast(t('groupLeft'));
    gcache.delete(id);
    if (activeGroup === id) closeChat();
    refreshGroups();
  });
}

function deleteGroup(id) {
  if (!confirm(t('groupDeleteConfirm'))) return;
  const payload = { id };
  if (groups.get(id)?.owner !== me) {
    const code = adminCode || prompt(t('adminCodePrompt'));
    if (!code) return;
    payload.code = code;
  }
  socket.emit('group_delete', payload, res => {
    closeModal();
    if (!res?.ok) return toast(t(res?.error === 'forbidden' ? 'badCode' : 'messageFailed'));
    toast(t('groupDeleted'));
    refreshGroups();
  });
}

function openGroupInfo(id) {
  const g = groups.get(id);
  if (!g) return;
  const isOwner = g.owner === me;
  const btns = [];
  if (!g.joined) btns.push(el('button', { class: 'btn', onclick: () => { closeModal(); joinGroup(id); } }, t('joinBtn')));
  else if (!isOwner) btns.push(el('button', { class: 'btn ghost', onclick: () => { closeModal(); leaveGroup(id); } }, t('leaveBtn')));
  btns.push(el('button', { class: 'btn danger', onclick: () => deleteGroup(id) }, t('groupDeleteBtn')));
  if (isOwner) btns.push(el('button', { class: 'btn ghost', onclick: () => openGroupModeration(id) }, '👑 Учасники та модератори'));
  const head = el('div', { class: 'pf-avatar' }, g.kind === 'channel' ? '📢' : '👥');
  head.style.background = avatarBg(g.title);
  if (g.avatar) head.append(el('img', { src: g.avatar, alt: '', style: 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%' }));
  if (isOwner) btns.push(el('button', { class: 'btn ghost', onclick: () => { closeModal(); pendingGroupAvatar = id; $('groupAvatarInput').click(); } }, '🖼 Змінити фото'));
  openModal([
    el('div', { class: 'pf-head' }, head, el('div', { class: 'pf-name' }, g.title)),
    el('div', { class: 'pf-status' }, (g.kind === 'channel' ? t('kindChannel') : t('kindGroup')) + ' · ' +
      (g.kind === 'channel' ? t('channelInfo', { n: g.members }) : t('groupInfo', { n: g.members }))),
    el('div', { class: 'pf-actions' }, ...btns),
  ]);
}

function openGroupModeration(id) {
  socket.emit('group_moderators', { id }, res => {
    if (!res?.ok) return toast('Не вдалося завантажити учасників');
    const body = el('div', {}, el('div', { class: 'acc-head' }, 'Учасники та модератори'));
    for (const m of res.members || []) {
      if (m.nick === me) { body.append(el('div', { class: 'item' }, el('div', { class: 'meta' }, el('div', { class: 'name' }, m.nick), el('div', { class: 'preview' }, m.role)))); continue; }
      const role = el('select', { class: 'field' });
      for (const [v, label] of [['member','Учасник'],['moderator','Модератор']]) role.append(el('option', { value: v, selected: m.role === v }, label));
      const save = el('button', { class: 'btn ghost', onclick: () => socket.emit('group_moderate', { id, nick: m.nick, action: role.value }, r => { if (!r?.ok) toast('Не вдалося змінити роль'); else toast('Роль оновлено'); }) }, 'Зберегти роль');
      const remove = el('button', { class: 'btn danger', onclick: () => { if (!confirm('Видалити ' + m.nick + ' з групи?')) return; socket.emit('group_moderate', { id, nick: m.nick, action: 'remove' }, r => { if (!r?.ok) return toast('Не вдалося видалити учасника'); openGroupModeration(id); refreshGroups(); }); } }, 'Видалити');
      body.append(el('div', { class: 'acc-row' }, el('div', { class: 'meta' }, el('div', { class: 'name' }, m.nick), role), el('div', { class: 'pf-actions' }, save, remove)));
    }
    openModal([body]);
  });
}

function openCreateGroup() {
  let kind = 'group';
  const title = el('input', { class: 'field', maxlength: '40', placeholder: t('groupTitle') });
  const kindBox = el('div', { class: 'pf-actions' });
  const drawKind = () => kindBox.replaceChildren(
    el('button', { class: 'btn' + (kind === 'group' ? '' : ' ghost'), onclick: () => { kind = 'group'; drawKind(); } }, t('kindGroup')),
    el('button', { class: 'btn' + (kind === 'channel' ? '' : ' ghost'), onclick: () => { kind = 'channel'; drawKind(); } }, t('kindChannel')));
  drawKind();
  openModal([
    el('div', { class: 'acc-head' }, t('newGroup')),
    kindBox,
    el('div', { style: 'height:10px' }),
    title,
    el('div', { class: 'pf-actions acc-foot' }, el('button', { class: 'btn', onclick: () => {
      const name = title.value.trim();
      if (!name) return toast(t('groupTitle'));
      socket.emit('group_create', { kind, title: name }, res => {
        if (!res?.ok) return toast(t('messageFailed'));
        toast(t('groupCreated'));
        refreshGroups(() => { closeModal(); openGroup(res.id); });
      });
    } }, t('createGroup'))),
  ]);
}

function openGroupsModal() {
  if (!socket?.connected) return toast(t('errNetwork'));
  socket.emit('group_list', {}, res => {
    if (!res?.ok) return toast(t('messageFailed'));
    const unread = new Map([...groups].map(([id, g]) => [id, g.unread || 0]));
    groups = new Map(res.chats.map(c => [c.id, { ...c, unread: unread.get(c.id) || 0 }]));
    renderList();
    const rows = res.chats.map(c => {
      const av = groupAvatarNode(c, 40);
      const sub = (c.kind === 'channel' ? t('kindChannel') : t('kindGroup')) + ' · ' +
        (c.kind === 'channel' ? t('channelInfo', { n: c.members }) : t('groupInfo', { n: c.members }));
      const btn = c.joined
        ? el('button', { class: 'btn', onclick: () => { closeModal(); openGroup(c.id); } }, t('openBtn'))
        : el('button', { class: 'btn', onclick: () => joinGroup(c.id) }, t('joinBtn'));
      return el('div', { class: 'acc-row' }, av,
        el('div', { class: 'meta', onclick: () => { closeModal(); openGroupInfo(c.id); } },
          el('div', { class: 'name' }, c.title), el('div', { class: 'sub' }, sub)),
        btn, el('button', { class: 'btn danger', onclick: () => deleteGroup(c.id) }, t('groupDeleteBtn')));
    });
    openModal([
      el('div', { class: 'acc-head' }, t('groupsTitle')),
      el('div', { class: 'pf-actions', style: 'margin-bottom:12px' },
        el('button', { class: 'btn', onclick: () => { closeModal(); openCreateGroup(); } }, t('newGroup'))),
      ...(rows.length ? rows : [el('div', { class: 'empty' }, t('noGroups'))]),
    ]);
  });
}

$('groupsBtn').addEventListener('click', openGroupsModal);

const displayName = n => (n === 'gigi_chat' ? 'gigi chat' : n);

// Opens the list of your gifts; one tap sends that gift to the open chat's person.
function openSendGiftToChat(nick) {
  socket.emit('gifts_mine', {}, res => {
    if (!res?.ok) return toast(t('messageFailed'));
    if (!res.items.length) return toast(t('noMyGifts'));
    openModal([
      el('div', { class: 'acc-head' }, t('giftChatTitle') + ' → ' + displayName(nick)),
      ...res.items.map(it => el('div', { class: 'acc-row' },
        el('img', { src: it.image, alt: '', style: 'width:40px;height:40px;border-radius:12px;object-fit:cover' }),
        el('div', { class: 'meta' }, el('div', { class: 'name' }, it.title), el('div', { class: 'sub' }, '⭐ ' + it.price)),
        el('button', { class: 'btn', onclick: () => socket.emit('gift_send', { id: it.id, to: nick }, r => {
          if (!r?.ok) return toast(t(r?.error === 'no_user' ? 'errNoUser' : r?.error === 'self' ? 'giftNoSelf' : 'messageFailed'));
          closeModal();
          toast(t('giftSent'));
        }) }, t('giftSendBtn')))),
    ]);
  });
}

function openBroadcast(it) {
  const count = el('input', { class: 'field', type: 'number', min: '1', max: '100', value: '1' });
  openModal([
    el('div', { class: 'acc-head' }, t('broadcastTitle')),
    el('div', { class: 'sub' }, t('broadcastCountQ')),
    count,
    el('div', { class: 'pf-actions acc-foot' }, el('button', { class: 'btn', onclick: () => {
      const n = Number(count.value);
      if (!Number.isInteger(n) || n < 1 || n > 100) return toast(t('broadcastCountQ'));
      if (!confirm(t('broadcastConfirm'))) return;
      adminCall('admin_gift_broadcast', { id: it.id, count: n }, () => { closeModal(); toast(t('broadcastDone')); });
    } }, t('broadcastBtn'))),
  ]);
}

$('giftChatBtn').addEventListener('click', () => { if (active) openSendGiftToChat(active); });

function loadMe() {
  if (!socket?.connected) return;
  socket.emit('me_info', {}, r => { if (r?.ok) myPremium = r.premium_until > Date.now(); });
}

function askHandle() {
  const h = prompt(t('handlePrompt'));
  if (!h) return;
  socket.emit('set_handle', { handle: h }, r => {
    if (r?.ok) return toast(t('handleSaved'));
    toast(t(r?.error === 'handle_taken' ? 'handleTaken' : 'handleInvalid'));
    askHandle();
  });
}

function setTheme(th) {
  localStorage.setItem('gigi_theme', th);
  document.documentElement.dataset.theme = th;
  openSettings();
}

function openSettings() {
  if (!socket?.connected) return toast(t('errNetwork'));
  const theme = document.documentElement.dataset.theme || 'dark';
  socket.emit('blocked_list', {}, res => {
    const rows = (res?.ok ? res.nicks : []).map(n => el('div', { class: 'acc-row' },
      avatarNode(n, null, 40),
      el('div', { class: 'meta' }, el('div', { class: 'name' }, n)),
      el('button', { class: 'btn ghost', onclick: () => unblockUser(n) }, t('unblockBtn'))));
    openModal([
      el('div', { class: 'acc-head' }, t('settingsTitle')),
      el('div', { class: 'sub' }, t('themeLabel')),
      el('div', { class: 'pf-actions', style: 'margin:8px 0 16px;flex-wrap:wrap' },
        ...[['dark','🌑 Темна'],['light','☀️ Світла'],['purple','💜 Фіолетова'],['ocean','🌊 Океан'],['rose','🌸 Рожева']].map(([key,label]) => el('button', { class: 'btn' + (theme === key ? '' : ' ghost'), onclick: () => setTheme(key) }, label))),
      el('div', { class: 'acc-head' }, '🔒 Безпека акаунта'),
      el('button', { class: 'btn ghost', style: 'width:100%;margin:8px 0 16px', onclick: changeAccountPassword }, '🔑 Змінити пароль акаунта'),
      el('div', { class: 'acc-head' }, t('premiumTitle')),
      el('div', { class: 'sub' }, myPremium ? t('premiumActive') : t('premiumNone')),
      el('div', { class: 'pf-actions', style: 'margin:8px 0 16px' },
        el('button', { class: 'btn', onclick: () => buyPremium(1) }, t('premium1Btn')),
        el('button', { class: 'btn', onclick: () => buyPremium(12) }, t('premium12Btn'))),
      el('div', { class: 'acc-head' }, t('blockedTitle')),
      ...(rows.length ? rows : [el('div', { class: 'empty' }, t('noBlocked'))]),
    ]);
  });
}

function changeAccountPassword() {
  const currentPassword = prompt('Введіть поточний пароль акаунта:');
  if (currentPassword === null) return;
  const newPassword = prompt('Введіть новий пароль (4–100 символів):');
  if (newPassword === null) return;
  const confirmPassword = prompt('Повторіть новий пароль:');
  if (confirmPassword === null) return;
  if (newPassword.length < 4 || newPassword.length > 100) return toast('Пароль має містити 4–100 символів');
  if (newPassword !== confirmPassword) return toast('Нові паролі не збігаються');
  socket.emit('change_password', { currentPassword, newPassword, token: localStorage.getItem('gigi_token') }, res => {
    if (!res?.ok) return toast(res?.error === 'wrong_password' ? 'Поточний пароль неправильний' : 'Не вдалося змінити пароль');
    toast('Пароль акаунта змінено');
    openSettings();
  });
}

function unblockUser(nick) {
  socket.emit('unblock', { nick }, () => openSettings());
}

function blockUser(nick) {
  if (!confirm(t('blockConfirm'))) return;
  socket.emit('block', { nick }, res => {
    if (!res?.ok) return toast(t(res?.error === 'no_user' ? 'errNoUser' : 'messageFailed'));
    toast(t('blocked'));
    closeModal();
  });
}

function buyPremium(months) {
  socket.emit('premium_buy', { months }, res => {
    if (!res?.ok) return toast(t(res?.error === 'no_stars' ? 'noStars' : 'messageFailed'));
    myPremium = true;
    toast(t('premiumBought'));
    openSettings();
  });
}

$('searchMsgBtn').addEventListener('click', () => {
  const q = prompt('Пошук повідомлень у чатах:');
  if (!q || !q.trim()) return;
  socket.emit('search_messages', { q: q.trim() }, res => {
    if (!res?.ok) return toast('Пошук не вдався');
    const rows = (res.results || []).map(r => el('button', { class: 'item', style: 'width:100%;text-align:left', onclick: () => { closeModal(); if (r.scope === 'pm') openChat(r.partner); else openGroup(r.chat); } }, el('div', { class: 'meta' }, el('div', { class: 'name' }, (r.scope === 'pm' ? r.partner : r.title) + ' · ' + r.from), el('div', { class: 'preview' }, r.text))));
    openModal([el('div', { class: 'acc-head' }, 'Результати пошуку'), ...(rows.length ? rows : [el('div', { class: 'empty' }, 'Нічого не знайдено')])]);
  });
});
$('settingsBtn').addEventListener('click', openSettings);

$('blockChatBtn').addEventListener('click', () => { $('chatMenu').hidden = true; if (active) blockUser(active); });
$('removeContactSelfBtn').addEventListener('click', () => {
  $('chatMenu').hidden = true; if (!active || activeGroup) return;
  const nick = active;
  if (!confirm(`Видалити контакт ${nick} тільки для себе? У співрозмовника історія залишиться.`)) return;
  socket.emit('conversation_remove', { nick, mode: 'self' }, res => {
    if (!res?.ok) return toast('Не вдалося видалити контакт');
    chats.delete(nick); cache.delete(nick); if (active === nick) closeChat(); renderList(); toast('Контакт видалено тільки для тебе');
  });
});
$('removeContactBothBtn').addEventListener('click', () => {
  $('chatMenu').hidden = true; if (!active || activeGroup) return;
  const nick = active;
  if (!confirm(`УВАГА! Видалити контакт ${nick} і всю історію повідомлень для ОБОХ сторін? Це незворотно.`)) return;
  if (!confirm('Підтверди остаточне видалення всієї переписки для обох учасників.')) return;
  socket.emit('conversation_remove', { nick, mode: 'both' }, res => {
    if (!res?.ok) return toast('Не вдалося видалити переписку');
    chats.delete(nick); cache.delete(nick); if (active === nick) closeChat(); renderList(); toast('Контакт і переписку видалено для обох');

function visualSelector(node) {
  const parts = [];
  let cur = node;
  while (cur && cur !== document.body) {
    if (cur.id) { parts.unshift('#' + CSS.escape(cur.id)); break; }
    const tag = cur.tagName.toLowerCase();
    let index = 1;
    for (let sib = cur.previousElementSibling; sib; sib = sib.previousElementSibling) if (sib.tagName === cur.tagName) index++;
    parts.unshift(tag + ':nth-of-type(' + index + ')');
    cur = cur.parentElement;
  }
  return 'body > ' + parts.join(' > ');
}

function applyVisualRules() {
  for (const [selector, rule] of Object.entries(visualRules || {})) {
    let nodes = [];
    try { nodes = document.querySelectorAll(selector); } catch { continue; }
    nodes.forEach(node => {
      if (rule.text !== undefined && node.children.length === 0 && node.textContent !== rule.text) node.textContent = rule.text;
      if (rule.color) node.style.color = rule.color;
      if (rule.backgroundColor) node.style.backgroundColor = rule.backgroundColor;
      if (rule.fontSize) node.style.fontSize = rule.fontSize;
      if (rule.borderRadius) node.style.borderRadius = rule.borderRadius;
      if (rule.translateX !== undefined || rule.translateY !== undefined) node.style.translate = (rule.translateX || '0px') + ' ' + (rule.translateY || '0px');
      if (rule.hidden !== undefined) node.style.display = rule.hidden ? 'none' : '';
    });
  }
}

function stopVisualEditor() {
  visualEditMode = false;
  document.body.classList.remove('visual-edit-mode');
  document.removeEventListener('click', visualEditorClick, true);
  document.querySelectorAll('.visual-edit-selected').forEach(n => n.classList.remove('visual-edit-selected'));
  visualSelected = null;
}

function ensureVisualObserver() {
  if (visualObserver) return;
  visualObserver = new MutationObserver(() => { if (!visualEditMode) applyVisualRules(); });
  visualObserver.observe(document.body, { childList: true, subtree: true });
}

function startVisualEditor() {
  const code = adminCode || prompt(t('adminCodePrompt'));
  if (!code) return;
  adminCode = code;
  visualEditMode = true;
  document.body.classList.add('visual-edit-mode');
  document.addEventListener('click', visualEditorClick, true);
  ensureVisualObserver();
  closeModal();
  toast('Режим редагування: натисни на елемент сторінки');
}

function visualEditorClick(event) {
  if (!visualEditMode) return;
  const target = event.target.closest('body *');
  if (!target || target.closest('#modal') || target.closest('#toast') || target.closest('.visual-editor-panel') || ['INPUT','TEXTAREA','SELECT','BUTTON','SVG','PATH'].includes(target.tagName)) return;
  event.preventDefault(); event.stopPropagation();
  document.querySelectorAll('.visual-edit-selected').forEach(n => n.classList.remove('visual-edit-selected'));
  visualSelected = target;
  target.classList.add('visual-edit-selected');
  openVisualElementEditor(target);
}

function openVisualElementEditor(node) {
  const selector = visualSelector(node);
  const old = visualRules[selector] || {};
  const leaf = node.children.length === 0;
  const textInput = el('textarea', { class: 'input', rows: 2, placeholder: leaf ? 'Текст елемента' : 'Текст можна змінювати лише в простих текстових елементах' });
  textInput.value = leaf ? (old.text ?? node.textContent.trim().slice(0, 200)) : '';
  textInput.disabled = !leaf;
  const color = el('input', { type: 'text', value: old.color || getComputedStyle(node).color, placeholder: '#ffffff або rgb(...)' });
  const bg = el('input', { type: 'text', value: old.backgroundColor || getComputedStyle(node).backgroundColor, placeholder: '#211a33 або transparent' });
  const size = el('input', { type: 'number', min: '8', max: '72', value: parseInt(old.fontSize || getComputedStyle(node).fontSize, 10) || 16 });
  const radius = el('input', { type: 'number', min: '0', max: '50', value: parseInt(old.borderRadius || getComputedStyle(node).borderRadius, 10) || 0 });
  const moveX = el('input', { type: 'number', min: '-500', max: '500', value: parseInt(old.translateX || '0', 10) || 0 });
  const moveY = el('input', { type: 'number', min: '-500', max: '500', value: parseInt(old.translateY || '0', 10) || 0 });
  const hidden = el('input', { type: 'checkbox' }); hidden.checked = Boolean(old.hidden);
  openModal([
    el('div', { class: 'acc-head' }, '🎨 Редагування елемента'),
    el('div', { class: 'sub' }, node.tagName.toLowerCase() + ' · ' + selector.slice(-90)),
    el('label', {}, 'Текст (для простих текстових елементів)'), textInput,
    el('label', {}, 'Колір тексту'), color,
    el('label', {}, 'Колір фону'), bg,
    el('label', {}, 'Розмір шрифту (px)'), size,
    el('label', {}, 'Заокруглення кутів (px)'), radius,
    el('label', {}, 'Зсув по горизонталі X (px)'), moveX,
    el('label', {}, 'Зсув по вертикалі Y (px)'), moveY,
    el('label', {}, hidden, ' Приховати елемент'),
    el('button', { class: 'btn', onclick: () => {
      const rule = { color: color.value, backgroundColor: bg.value, fontSize: Math.max(8, Math.min(72, Number(size.value) || 16)), borderRadius: Math.max(0, Math.min(50, Number(radius.value) || 0)), hidden: hidden.checked };
      rule.translateX = Math.max(-500, Math.min(500, Number(moveX.value) || 0));
      rule.translateY = Math.max(-500, Math.min(500, Number(moveY.value) || 0));
      if (leaf) rule.text = textInput.value.slice(0, 200);
      visualRules[selector] = rule;
      applyVisualRules();
      adminCall('admin_visual_save', { rules: visualRules }, r => { visualRules = { ...visualRules }; toast('Зміни збережено для всіх користувачів'); stopVisualEditor(); });
    } }, '💾 Зберегти для всіх'),
    el('button', { class: 'btn ghost', onclick: () => { closeModal(); stopVisualEditor(); } }, 'Вийти з редактора')
  ]);
}

}

function adminGiveGift(it) {
  const nick = (prompt(t('giftNick')) || '').trim();
  if (!nick) return;
  adminCall('admin_gift_give', { id: it.id, nick }, () => { closeModal(); toast(t('giftSent')); });
}

function adminDeleteGift(it) {
  if (!confirm(t('giftDeleteConfirm'))) return;
  adminCall('admin_gift_delete', { id: it.id }, () => { closeModal(); toast(t('giftDeleted')); openMarket(); });
}

function openCreateGift() {
  let image = null;
  const title = el('input', { class: 'field', maxlength: '40', placeholder: t('giftTitleField') });
  const desc = el('input', { class: 'field', maxlength: '200', placeholder: t('giftDescField') });
  const price = el('input', { class: 'field', type: 'number', min: '1', placeholder: t('giftPriceField') });
  const count = el('input', { class: 'field', type: 'number', min: '1', max: '100', value: '1', placeholder: t('giftCountField') });
  const status = el('div', { class: 'sub' }, t('giftPhotoNone'));
  const file = el('input', { type: 'file', accept: 'image/*', hidden: '' });
  file.addEventListener('change', async e => {
    const f = e.target.files?.[0];
    e.target.value = '';
    if (!f) return;
    try {
      image = await uploadBlob(await compressImage(f));
      status.textContent = t('giftPhotoOk');
    } catch {
      toast(t('uploadFailed'));
    }
  });
  openModal([
    el('div', { class: 'acc-head' }, t('createGiftBtn')),
    el('button', { class: 'btn ghost', style: 'width:100%', onclick: () => file.click() }, t('giftPhotoBtn')),
    file, status,
    el('div', { style: 'height:8px' }), title,
    el('div', { style: 'height:8px' }), desc,
    el('div', { style: 'height:8px' }), price,
    el('div', { style: 'height:8px' }), count,
    el('div', { class: 'pf-actions acc-foot' }, el('button', { class: 'btn', onclick: () => {
      if (!image) return toast(t('giftPhotoNone'));
      adminCall('admin_gift_create', {
        title: title.value.trim(), description: desc.value.trim(), price: Number(price.value), count: Number(count.value), image,
      }, () => { toast(t('giftCreated')); openMarket(); });
    } }, t('giftCreateBtn'))),
  ]);
}

function openAdminStars() {
  const nick = el('input', { class: 'field', placeholder: t('giftNick'), maxlength: '20', value: me || '' });
  const amount = el('input', { class: 'field', type: 'number', min: '1', placeholder: t('starsAmount') });
  openModal([
    el('div', { class: 'acc-head' }, t('adminStarsBtn')),
    nick,
    el('div', { style: 'height:8px' }), amount,
    el('div', { class: 'pf-actions acc-foot' }, el('button', { class: 'btn', onclick: () => {
      adminCall('admin_stars', { nick: nick.value.trim(), amount: Number(amount.value) }, () => {
        toast(t('starsGiven'));
        openMarket();
      });
    } }, t('giveStarsBtn'))),
  ]);
}

$('marketBtn')?.addEventListener('click', openMarket);

const INVITE_URL = 'https://sites.google.com/view/gigichatdownloader/gigi';

// Copies the invite text and opens the share sheet. The 15 stars are given once per day.
$('inviteBtn').addEventListener('click', () => {
  const text = t('inviteText') + ' ' + INVITE_URL;
  navigator.clipboard?.writeText(text).then(() => toast(t('inviteCopied'))).catch(() => {});
  if (navigator.share) navigator.share({ text, url: INVITE_URL }).catch(() => {});
  if (!socket?.connected) return;
  socket.emit('invite_reward', {}, res => {
    if (res?.ok) toast(t('inviteRewarded'));
    else if (res?.error === 'already') toast(t('inviteAlready'));
  });
});
$('myProfileBtn').addEventListener('click', () => { if (me) openProfile(me); });

function applyAvatar(node, nick) {
  node.replaceChildren(nick[0].toUpperCase());
  node.style.background = avatarBg(nick);
  const url = avatars.get(nick);
  if (url) node.replaceChildren(el('img', { src: url, alt: '' }));
}

$('photoBtn').addEventListener('click', () => $('avatarInput').click());
$('groupAvatarInput').addEventListener('change', async e => {
  const f = e.target.files?.[0];
  e.target.value = '';
  const id = pendingGroupAvatar; pendingGroupAvatar = null;
  if (!f || !id) return;
  if (!f.type.startsWith('image/') || f.size > 15 * 1024 * 1024) return toast(t('badFile'));
  try {
    const url = await uploadBlob(await compressImage(f));
    socket.emit('group_set_avatar', { id, url, code: adminCode || undefined }, res => {
      if (!res?.ok) return toast(res?.error === 'forbidden' ? t('badCode') : t('messageFailed'));
      const g = groups.get(id); if (g) g.avatar = url;
      refreshGroups(() => { if (activeGroup === id) renderGroupHeader(); });
      toast('Фото групи/каналу збережено');
      if (!$('modal').hidden) openGroupInfo(id);
    });
  } catch { toast(t('uploadFailed')); }
});

$('avatarInput').addEventListener('change', async e => {
  const f = e.target.files?.[0];
  e.target.value = '';
  if (!f) return;
  if (!f.type.startsWith('image/')) return toast(t('badFile'));
  if (f.size > 15 * 1024 * 1024) return toast(t('fileTooBig'));
  if (!socket?.connected) return toast(t('errNetwork'));
  let res;
  try {
    const data = await readAsDataURL(new Blob([f], { type: f.type.split(';')[0] }));
    res = await (await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: localStorage.getItem('gigi_token'), data })
    })).json();
  } catch { return toast(t('uploadFailed')); }
  if (!res?.ok || res.kind !== 'image') return toast(t('badFile'));
  socket.emit('set_avatar', { url: res.url }, ack => toast(ack?.ok ? t('photoSaved') : t('messageFailed')));
});

$('moreBtn').addEventListener('click', e => { e.stopPropagation(); $('chatMenu').hidden = !$('chatMenu').hidden; });
document.addEventListener('click', () => { $('chatMenu').hidden = true; });

$('adminDelBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('chatMenu').hidden = true;
  if (!active) return;
  if (!confirm(t('adminConfirm'))) return;
  const code = prompt(t('adminCodePrompt'));
  if (!code) return;
  socket.emit('admin_delete', { nick: active, code }, res => {
    if (res?.ok) return toast(t('adminDone'));
    const keys = { bad_code: 'badCode', no_user: 'errNoUser' };
    toast(t(keys[res?.error] || 'messageFailed'));
  });
});

$('back').addEventListener('click', closeChat);

$('renameBtn').addEventListener('click', () => {
  const input = prompt(t('renamePrompt'), me);
  if (input === null) return;
  const nick = input.trim();
  if (!NICK_RE.test(nick)) return toast(t('errInvalidNick'));
  if (!socket?.connected) return toast(t('errNetwork'));
  socket.emit('rename', { nick }, res => {
    if (!res?.ok) return toast(t(res?.error === 'nick_taken' ? 'errNickTaken' : 'errInvalidNick'));
    toast(t('renamed'));
  });
});

$('deleteBtn').addEventListener('click', () => {
  if (!confirm(t('confirmDelete'))) return;
  if (!socket?.connected) return toast(t('errNetwork'));
  socket.emit('delete', {}, res => { if (!res?.ok) toast(t('messageFailed')); });
});

$('logout').addEventListener('click', () => {
  forget();
  location.reload();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-set-lang]');
  if (!b) return;
  lang = b.dataset.setLang;
  localStorage.setItem('gigi_lang', lang);
  applyI18n();
});

document.documentElement.dataset.theme = localStorage.getItem('gigi_theme') || 'dark';
applyI18n();
setHint('nickHint');
if (localStorage.getItem('gigi_token') && me) {
  showApp();
  createSocket();
} else {
  forget();
  showLogin();
  const flash = sessionStorage.getItem('gigi_flash');
  if (flash) { sessionStorage.removeItem('gigi_flash'); setHint(flash); }
}
</script>
